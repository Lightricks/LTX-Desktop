name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Pyright type check
        working-directory: backend
        run: uv run pyright

      - name: OpenAPI contract check
        run: pnpm run openapi:check

      - name: TypeScript type check
        run: pnpm run typecheck:ts

      - name: ESLint
        run: pnpm run lint

      - name: Pack helper tests
        run: pnpm run scripts:test

      - name: File size check
        run: bash scripts/check-file-sizes.sh origin/main

  test-python-windows:
    name: Python Tests (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - &checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - &setup-uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - &setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - &install-backend
        name: Install dependencies
        run: uv sync --frozen --extra test --extra dev

      # The full suite runs on Linux. Windows only runs tests that call the
      # real Win32 DLL APIs. `--` keeps `-m` from being read as a uv flag.
      - name: Run tests
        run: uv run -- pytest -v --tb=short -m ci_os

  # One Linux pytest job was the wait. Four shards run together.
  # The matrix length and `--splits` below are the same number.
  test-python-linux:
    name: Python Tests (linux ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    steps:
      - *checkout
      - *setup-uv
      - *setup-python
      - *install-backend
      # `--` keeps `--splits` from being read as a uv flag.
      # least_duration deals tests round-robin when there is no durations file,
      # so a slow module is not collected entirely onto the first shard.
      - name: Run tests
        run: uv run -- pytest -v --tb=short --splits 4 --group ${{ matrix.shard }} --splitting-algorithm least_duration

  # Branch protection still looks for this name. It passes when every Linux shard passes.
  test-python-linux-gate:
    name: Python Tests (linux)
    needs: test-python-linux
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Linux shard
        run: test "${{ needs.test-python-linux.result }}" = "success"

  build-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build:frontend
